[project]
name = "wager-book"
version = "0.8.2"
description = "Wager Book - a book of Kalshi and Polymarket wagers, open and closed (PySide6)"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    # The certificate list https requests are checked against, shipped with the
    # app so a standalone Mac build can reach the price sites. See httpsService.
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]
# Only needed to produce a standalone build; see tools/buildExe.py. Kept out
# of dev so a checkout that only runs the app and the tests stays smaller.
build = [
    "pyinstaller>=6.16,<7",
    # macOS only, and only at build time: PyInstaller renders the .icns the
    # bundle needs from the 1024 px PNG through Pillow.
    "pillow>=10,<12; sys_platform == 'darwin'",
]

[project.scripts]
wager-book = "wagerBook.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wagerBook"]
